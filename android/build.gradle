group 'com.hugocornellier.flutter_litert_flex'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// Kotlin plugin selection across AGP versions. On AGP >= 9 with built-in Kotlin
// enabled (the default), built-in Kotlin compiles the sources and KGP must NOT be
// applied. But if built-in Kotlin is disabled (android.builtInKotlin=false, which
// the Flutter AGP-9 migrator adds to consumer apps), KGP is the only Kotlin
// compiler, so it MUST be applied; otherwise this plugin's Kotlin classes never
// compile and the consumer app fails with "cannot find class FlutterLitertFlexPlugin".
// On AGP < 9 there is no built-in Kotlin, so KGP is always required.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlinProperty = providers.gradleProperty('android.builtInKotlin').orNull
def isBuiltInKotlinEnabled = agpMajor >= 9 && (builtInKotlinProperty == null || builtInKotlinProperty.toBoolean())
def shouldApplyKotlinAndroidPlugin = agpMajor < 9 || !isBuiltInKotlinEnabled
if (shouldApplyKotlinAndroidPlugin) {
    apply plugin: 'kotlin-android'
}

android {
    namespace 'com.hugocornellier.flutter_litert_flex'

    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdk 24
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                it.useJUnitPlatform()

                it.outputs.upToDateWhen { false }

                it.testLogging {
                    events 'passed', 'skipped', 'failed', 'standardOut', 'standardError'
                    showStandardStreams = true
                }
            }
        }
    }
}

// Pin the Kotlin JVM target to 17 to match Java. Works under both legacy KGP
// (AGP < 9) and built-in Kotlin (AGP >= 9). Guarded so an AGP 9 setup without
// built-in Kotlin (no kotlin extension registered) is skipped rather than
// erroring on the kotlin {} DSL.
if (project.extensions.findByName('kotlin') != null) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
}

dependencies {
    implementation 'org.tensorflow:tensorflow-lite:+'
    implementation 'org.tensorflow:tensorflow-lite-select-tf-ops:+'
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testImplementation 'org.mockito:mockito-core:5.0.0'
}
